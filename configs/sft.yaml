seed: 42
model_id: Qwen/Qwen3-4B-Instruct-2507
output_dir: checkpoints/sft
data:
  train: data/processed/cspider/train.jsonl
  validation: data/processed/cspider/validation.jsonl
lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: all-linear
training:
  epochs: 1
  per_device_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  max_length: 2048
  packing: true
  report_to: tensorboard
  save_steps: 25
  save_total_limit: 3
  resume_from_checkpoint: auto

