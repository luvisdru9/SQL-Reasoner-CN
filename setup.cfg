[metadata]
name = sql-reasoner-cn
version = 0.1.0
description = Chinese Text-to-SQL post-training with verifiable rewards
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    numpy==2.1.3
    PyYAML==6.0.2
    sqlglot==27.28.1

[options.packages.find]
where = src

[options.extras_require]
train =
    accelerate==1.10.1
    bitsandbytes==0.48.1
    datasets==4.2.0
    peft==0.17.1
    torch==2.8.0
    transformers==4.57.1
    trl==0.24.0
    vllm==0.10.2
    tensorboard==2.20.0
demo =
    gradio==5.49.1
eval =
    scipy==1.15.3
dev =
    pytest==8.4.2
    ruff==0.14.2

[options.entry_points]
console_scripts =
    sql-reasoner-demo = sql_reasoner.app:main

